name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components.
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Fetch the verified sherpa-onnx static library
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/sherpa-onnx" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check crate dependency direction
        run: cargo xtask deps-check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Install pinned frontend build tools
        run: |
          deploy/web-tools/install.sh "$RUNNER_TEMP/web-tools"
          echo "$RUNNER_TEMP/web-tools" >> "$GITHUB_PATH"

      - name: Build frontend
        run: |
          cargo fetch --locked
          cd crates/omni-web
          trunk build --release --offline --locked

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/omni-notify:latest
            ghcr.io/${{ github.repository_owner }}/omni-notify:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # mode=max keeps the cargo-chef dependency layers of the build stages.
          cache-from: type=gha,scope=omni-notify
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=omni-notify,mode=max' || '' }}

      - name: Logout from GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: docker logout ghcr.io

  notify:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-publish]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.lint-and-test.result == 'failure' || needs.build-and-publish.result == 'failure')

    steps:
      - name: Send CI failure notification
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          TITLE="omni-notify CI failed"
          FAILED=""
          [ "${{ needs.lint-and-test.result }}" = "failure" ] && FAILED="lint-and-test"
          [ "${{ needs.build-and-publish.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }build-and-publish"
          MESSAGE="Failed jobs: ${FAILED}"
          curl -s -o /dev/null \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=$TITLE" \
            --form-string "message=$MESSAGE" \
            --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View run" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
