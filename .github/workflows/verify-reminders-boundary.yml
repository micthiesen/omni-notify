name: Verify Reminders LAN boundary

on:
  workflow_dispatch:
    inputs:
      origin_ipv4:
        description: Current public IPv4 of Boris's existing HTTPS ingress
        required: true
        type: string

permissions: {}

jobs:
  external-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reject external requests, including forged LAN headers
        env:
          ORIGIN_IPV4: ${{ inputs.origin_ipv4 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress, os
          address = ipaddress.IPv4Address(os.environ['ORIGIN_IPV4'])
          assert address.is_global, 'Expected a public IPv4 address'
          PY
          failed=0
          for mode in plain forged; do
            headers=()
            if [[ "$mode" == forged ]]; then
              headers=(-H 'X-Real-IP: 10.10.1.42' -H 'X-Forwarded-For: 10.10.1.42' -H 'CF-Connecting-IP: 10.10.1.42')
            fi
            status=$(curl --silent --show-error --max-time 20 \
              --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' \
              --resolve "omni.syas.ca:443:${ORIGIN_IPV4}" \
              "${headers[@]}" --output /dev/null --write-out '%{http_code}' \
              "https://omni.syas.ca/api/health?omni_probe=github_${GITHUB_RUN_ID}_${mode}")
            echo "$mode request: HTTP $status"
            if [[ "$status" != 403 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Report legacy aliases and public integration routes
        if: always()
        env:
          ORIGIN_IPV4: ${{ inputs.origin_ipv4 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress, os
          assert ipaddress.IPv4Address(os.environ['ORIGIN_IPV4']).is_global
          PY
          # Read-only observations, without credentials, response bodies, or redirects.
          # Legacy HTTPS is also checked without bypassing its mismatched certificate.
          failed=0
          for origin in http://omni.boris https://omni.boris http://pods.syas.ca https://pods.syas.ca; do
            resolve=()
            if [[ "$origin" == *omni.boris ]]; then
              resolve=(--resolve "omni.boris:80:${ORIGIN_IPV4}" --resolve "omni.boris:443:${ORIGIN_IPV4}")
            elif [[ "$origin" == http://pods.syas.ca ]]; then
              resolve=(--resolve "pods.syas.ca:80:${ORIGIN_IPV4}")
            fi
            for path in /api/health /reminders /api/reminders/status /mcp /pods/rss /pods/logo.jpeg; do
              result=0
              status=$(curl --silent --show-error --max-time 15 \
                --user-agent 'OpenAI File Downloader, XaiImageApiFetch/1.0' \
                "${resolve[@]}" --output /dev/null --write-out '%{http_code}' \
                "${origin}${path}?omni_probe=github_${GITHUB_RUN_ID}_aliases") || result=$?
              echo "$origin$path: HTTP $status; curl exit $result"
              case "$origin" in
                http://omni.boris) expected=0:403 ;;
                https://omni.boris)
                  # This legacy private suffix still has a hostname mismatch.
                  # Do not bypass TLS to probe it; use omni.syas.ca for HTTPS.
                  expected=60:000 ;;
                http://pods.syas.ca) expected=0:301 ;;
                *)
                  expected=0:404
                  [[ "$path" == /pods/rss ]] && expected=0:401
                  [[ "$path" == /pods/logo.jpeg ]] && expected=0:200 ;;
              esac
              if [[ "$result:$status" != "$expected" ]]; then failed=1; fi
            done
          done
          exit "$failed"
