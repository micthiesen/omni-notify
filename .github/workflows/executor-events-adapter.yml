name: Executor Events Adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/omni-events-adapter/**
      - deploy/executor-events/Dockerfile
      - deploy/executor-events/Dockerfile.dockerignore
      - deploy/build-tools/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/executor-events-adapter.yml
  pull_request:
    branches: [main]
    paths:
      - crates/omni-events-adapter/**
      - deploy/executor-events/Dockerfile
      - deploy/executor-events/Dockerfile.dockerignore
      - deploy/build-tools/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/executor-events-adapter.yml

concurrency:
  group: executor-events-adapter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Same shape as ci.yml: the image builds into the GitHub Actions cache beside the
# checks, and `publish` pushes that cached build only after both pass.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: executor-events-adapter
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint adapter
        run: cargo clippy -p omni-events-adapter --all-targets --locked -- -D warnings
      - name: Check protocol and authentication compatibility
        run: cargo test -p omni-events-adapter --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The workspace root is the context; Dockerfile.dockerignore beside the
          # Dockerfile limits it to the Cargo workspace.
          context: .
          file: deploy/executor-events/Dockerfile
          push: false
          cache-from: type=gha,scope=executor-events-adapter
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=executor-events-adapter,mode=max,ignore-error=true' || '' }}

  publish:
    runs-on: ubuntu-latest
    needs: [verify, image]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/executor-events/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/executor-events-adapter:latest
            ghcr.io/${{ github.repository_owner }}/executor-events-adapter:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=executor-events-adapter
