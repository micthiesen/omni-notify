name: Executor Events Adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/omni-events-adapter/**
      - deploy/executor-events/Dockerfile
      - deploy/executor-events/Dockerfile.dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/executor-events-adapter.yml
  pull_request:
    branches: [main]
    paths:
      - crates/omni-events-adapter/**
      - deploy/executor-events/Dockerfile
      - deploy/executor-events/Dockerfile.dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/executor-events-adapter.yml

concurrency:
  group: executor-events-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: executor-events-adapter
      - name: Lint adapter
        run: cargo clippy -p omni-events-adapter --all-targets --locked -- -D warnings
      - name: Check protocol and authentication compatibility
        run: cargo test -p omni-events-adapter --locked
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          # The workspace root is the context; Dockerfile.dockerignore beside the
          # Dockerfile limits it to the Cargo workspace.
          context: .
          file: deploy/executor-events/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/executor-events-adapter:latest
            ghcr.io/${{ github.repository_owner }}/executor-events-adapter:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=executor-events-adapter
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=executor-events-adapter,mode=max' || '' }}
