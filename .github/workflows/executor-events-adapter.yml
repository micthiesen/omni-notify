name: Executor Events Adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/executor-events-adapter/**
      - .github/workflows/executor-events-adapter.yml
  pull_request:
    branches: [main]
    paths:
      - packages/executor-events-adapter/**
      - .github/workflows/executor-events-adapter.yml

concurrency:
  group: executor-events-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/executor-events-adapter/package-lock.json
      - name: Install pinned adapter dependencies
        run: npm ci --ignore-scripts
        working-directory: packages/executor-events-adapter
      - name: Build adapter
        run: npm run build
        working-directory: packages/executor-events-adapter
      - name: Check protocol and authentication compatibility
        run: npm test
        working-directory: packages/executor-events-adapter
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: packages/executor-events-adapter
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/executor-events-adapter:latest
            ghcr.io/${{ github.repository_owner }}/executor-events-adapter:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
