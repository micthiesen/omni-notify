# Built with `trunk build --release crates/omni-web/index.html` (Docker web
# stage and CI). Hashed assets land in dist/assets/, which the server caches
# as immutable; index.html is served `no-cache`.
[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = true
# No inline bootstrap: the hashed js/boot.js module reads these paths, so a
# CSP of `script-src 'self' 'wasm-unsafe-eval'` is enough.
pattern_script = "<meta name=\"omni-bundle\" data-js=\"{base}{js}\" data-wasm=\"{base}{wasm}\">"

[tools]
# Must match the workspace wasm-bindgen pin and deploy/web-tools/install.sh.
wasm_bindgen = "0.2.129"
wasm_opt = "version_133"

[serve]
addresses = ["127.0.0.1"]
port = 8081

[[proxy]]
backend = "http://localhost:3000/api/"
