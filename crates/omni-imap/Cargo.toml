[dependencies]
base64.workspace = true
futures.workspace = true
hex.workspace = true
imap-proto.workspace = true
indexmap.workspace = true
jiff.workspace = true
mail-builder.workspace = true
mail-parser.workspace = true
omni-core.workspace = true
omni-http.workspace = true
omni-mailer.workspace = true
omni-mcp-kit.workspace = true
omni-runtime.workspace = true
omni-store.workspace = true
omni-tasks.workspace = true
rand.workspace = true
regex.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
omni-imap = { path = ".", features = ["testing"] }
omni-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
