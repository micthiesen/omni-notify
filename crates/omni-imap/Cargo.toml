[package]
name = "omni-imap"
description = "iCloud IMAP transport, exact archive actions, drafts, Sent copies and compose tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
